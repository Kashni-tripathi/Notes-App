<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Notes</title>
</head>
<body>
    <h2>Welcome, <span id="loggedUserFName"></span> <span id="loggedUserLName"></span></h2>
    <p>Email: <span id="loggedUserEmail"></span></p>

    <h3>Add a New Note</h3>
    <input type="text" id="noteTitle" placeholder="Note Title"><br>
    <textarea id="noteContent" placeholder="Note Content"></textarea><br>
    <button id="saveNote">Save Note</button>

    <h3>Your Notes</h3>
    <ul id="notesList"></ul>

    <button id="logout">Logout</button>

    <!-- Firebase JS SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
        import {
            getFirestore,
            getDoc,
            doc,
            addDoc,
            collection,
            onSnapshot,
            deleteDoc,
            updateDoc
        } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyBq5NDV1MvXYKmsT7L5GhWOfmxA0wwY1DA",
            authDomain: "login-form-7d41f.firebaseapp.com",
            projectId: "login-form-7d41f",
            storageBucket: "login-form-7d41f.firebasestorage.app",
            messagingSenderId: "810208063856",
            appId: "1:810208063856:web:83d9a20080563078cfdfb5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth();
        const db = getFirestore();

        let uid = null;
        let editingNoteId = null; // Track which note is being edited

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                uid = user.uid;

                // Get user data
                const userDoc = await getDoc(doc(db, "users", uid));
                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    document.getElementById('loggedUserFName').innerText = userData.firstName;
                    document.getElementById('loggedUserLName').innerText = userData.lastName;
                    document.getElementById('loggedUserEmail').innerText = userData.email;
                }

                // Real-time notes listener
                const notesRef = collection(db, "users", uid, "notes");
                onSnapshot(notesRef, (snapshot) => {
                    const notesList = document.getElementById('notesList');
                    notesList.innerHTML = "";

                    snapshot.forEach((docSnap) => {
                        const note = docSnap.data();
                        const li = document.createElement('li');
                        li.innerHTML = `
                            <strong>${note.title}</strong><br>${note.content}
                            <br>
                            <button data-id="${docSnap.id}" class="editBtn">Edit</button>
                            <button data-id="${docSnap.id}" class="deleteBtn">Delete</button>
                            <hr>`;
                        notesList.appendChild(li);
                    });

                    // Delete note handler
                    document.querySelectorAll('.deleteBtn').forEach(button => {
                        button.addEventListener('click', async () => {
                            const noteId = button.getAttribute('data-id');
                            await deleteDoc(doc(db, "users", uid, "notes", noteId));
                        });
                    });

                    // Edit note handler
                    document.querySelectorAll('.editBtn').forEach(button => {
                        button.addEventListener('click', () => {
                            const noteId = button.getAttribute('data-id');
                            const noteData = snapshot.docs.find(doc => doc.id === noteId).data();

                            document.getElementById('noteTitle').value = noteData.title;
                            document.getElementById('noteContent').value = noteData.content;
                            editingNoteId = noteId;
                            document.getElementById('saveNote').innerText = "Update Note";
                        });
                    });
                });

                // Save or Update Note
                document.getElementById('saveNote').addEventListener('click', async () => {
                    const title = document.getElementById('noteTitle').value.trim();
                    const content = document.getElementById('noteContent').value.trim();

                    if (!title || !content) {
                        alert("Please fill in both title and content.");
                        return;
                    }

                    if (editingNoteId) {
                        // Update existing note
                        const noteRef = doc(db, "users", uid, "notes", editingNoteId);
                        await updateDoc(noteRef, { title, content });
                        alert("Note updated!");
                        editingNoteId = null;
                        document.getElementById('saveNote').innerText = "Save Note";
                    } else {
                        // Create new note
                        await addDoc(collection(db, "users", uid, "notes"), {
                            title,
                            content,
                            createdAt: new Date()
                        });
                        alert("Note saved!");
                    }

                    // Clear fields
                    document.getElementById('noteTitle').value = "";
                    document.getElementById('noteContent').value = "";
                });

            } else {
                alert("No user is logged in. Redirecting to login...");
                window.location.href = "index.html";
            }
        });

        // Logout handler
        document.getElementById('logout').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            });
        });
    </script>
</body>
</html>
